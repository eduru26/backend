# ── Eduru API gateway + load balancer ───────────────────────────────
#
# Single public entry point in front of the FastAPI backend replicas.
# Responsibilities:
#   * Routing            — all /api-facing traffic terminates here.
#   * Load balancing     — round-robins across every `backend` replica.
#   * Edge concerns      — gzip, security headers, body-size caps,
#                          sane proxy timeouts for the slow chat path.
#   * Client identity    — sets X-Forwarded-For so the app's rate
#                          limiter keys on the real client IP.
#
# Backend discovery: in Docker (compose --scale or Swarm) the service
# name `backend` resolves to ALL replica IPs via the embedded DNS at
# 127.0.0.11. nginx caches DNS, so to pick up replicas as they scale up
# and down we resolve `backend` per-request through a variable in
# proxy_pass (the standard nginx dynamic-upstream trick).

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Docker's embedded DNS — short TTL so new replicas join the rotation
    # within ~10s of `docker compose up --scale` / `docker service scale`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # gzip text payloads (JSON API responses)
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 512;

    # Body-size cap at the edge — matches the backend's largest accepted
    # upload (5 MB PDF). Rejected here before reaching a backend worker.
    client_max_body_size 6m;

    # Per-IP request throttle at the edge — a coarse first line of
    # defence; the app's slowapi limiter does the fine-grained per-route
    # limits. burst absorbs short spikes, nodelay rejects beyond that.
    limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;

    upstream eduru_backend {
        # Placeholder — real resolution happens via the $backend variable
        # below. Keeping a named upstream documents intent.
        zone eduru_backend 64k;
        server backend:8000 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Security headers applied to every response.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Gateway's own liveness — does not touch the backend.
        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"gateway":"ok"}';
        }

        location / {
            limit_req zone=edge burst=60 nodelay;

            # Per-request DNS resolution → load-balances across all
            # backend replicas as they scale.
            set $backend "http://backend:8000";
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # The chat path waits on Ollama — generous read timeout so a
            # legitimately slow LLM response isn't cut off, but not
            # infinite (a truly hung backend should still fail).
            proxy_connect_timeout 5s;
            proxy_send_timeout    130s;
            proxy_read_timeout    130s;

            # Don't retry non-idempotent POSTs against another replica;
            # do fail over on connection errors for GETs.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
